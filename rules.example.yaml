# 分类规则库（模板）。复制成 rules.yaml 再改，rules.yaml 已被 .gitignore 忽略。
# 改词不用改代码，改完跑 `python run.py classify --replay` 秒级重算。
#
# 打分：Σ 权重(strong 2.5 / normal 1.0) × 字段权重(标题 1.8 / 摘要 0.6 / 正文 0.8)
#       + 1.0（仅当标题命中 >= title_bonus_min_strong 个 strong）
# 分档：>= gray_high 高置信；gray_low~gray_high 置信中（进待核实）；< gray_low 不入候选

version: 1

defaults:
  title_weight: 1.8
  digest_weight: 0.6
  body_weight: 0.8
  strong_weight: 2.5
  normal_weight: 1.0
  title_bonus: 1.0
  title_bonus_min_strong: 2
  gray_low: 2.5
  gray_high: 5.0
  # 排除类：分数达到该值才归入该类，否则记为"未达阈值"
  exclude_min_score: 1.0

# 栏目映射。很多公众号的标题写成「正文标题 | 栏目」，栏目是编辑自己打的标签，
# 比关键词可靠得多，所以命中栏目直接给一个超过高置信阈值的底座分。
# 值为 null 表示该栏目内容太杂，只记录不定性（简讯类栏目里既有活动也有普通讲座）。
channel_weight: 6.0
channels:
  荣誉播报: honor
  业绩捷报: case_achievement
  党建工作: party_building
  专业视点: exclude_pro
  讲座预告: exclude_notice
  新闻简讯: null
  年度案例: exclude_annual_case

# 年度总结类文章是大事记最好的交叉校验源，命中即置顶，绝不排除
annual_review_words:
  - 十件大事
  - 年度大事
  - 年度回顾
  - 盘点
  - 年度总结
  - 成绩单
  - 年度亮点
  - 巡礼
  - 答卷
  # 多数单位每年 5–6 月集中发布的评选系列，等于官方认可的年度业绩清单
  - 年度案例
  - 十佳案例
  - 优秀案例
  - 优秀案例
  - 评选结果公示
  - 年度优秀案例

